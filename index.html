<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking | Grimório Dev</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <a href="#" class="logo" aria-label="Página inicial">Logo</a>
  </header>

  <main class="pagina">
    <h1 class="titulo">Ranking</h1>

    <!-- Pódio: 2º, 1º e 3º lugar -->
    <section class="podio" aria-label="Três primeiros colocados">
      <a href="#" class="podio__item podio__item--2">
        <span class="avatar"></span>
        <span class="podio__nome">Player</span>
      </a>
      <a href="#" class="podio__item podio__item--1">
        <span class="avatar"></span>
        <span class="podio__nome">Player</span>
      </a>
      <a href="#" class="podio__item podio__item--3">
        <span class="avatar"></span>
        <span class="podio__nome">Player</span>
      </a>
    </section>

    <!-- Lista de jogadores -->
    <section class="lista" aria-label="Classificação completa">
      <ol class="lista__itens">
        <li><a href="#" class="jogador"><span class="jogador__pos">1</span><span class="jogador__foto"></span><span class="jogador__nome">Player name</span><span class="jogador__pontos">XX</span></a></li>
        <li><a href="#" class="jogador"><span class="jogador__pos">2</span><span class="jogador__foto"></span><span class="jogador__nome">Player name</span><span class="jogador__pontos">XX</span></a></li>
        <li><a href="#" class="jogador"><span class="jogador__pos">3</span><span class="jogador__foto"></span><span class="jogador__nome">Player name</span><span class="jogador__pontos">XX</span></a></li>
        <li><a href="#" class="jogador"><span class="jogador__pos">4</span><span class="jogador__foto"></span><span class="jogador__nome">Player name</span><span class="jogador__pontos">XX</span></a></li>
        <li><a href="#" class="jogador"><span class="jogador__pos">5</span><span class="jogador__foto"></span><span class="jogador__nome">Player name</span><span class="jogador__pontos">XX</span></a></li>
        <li><a href="#" class="jogador"><span class="jogador__pos">6</span><span class="jogador__foto"></span><span class="jogador__nome">Player name</span><span class="jogador__pontos">XX</span></a></li>
      </ol>
    </section>

    <a href="#" class="botao">pular</a>
